<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#071621">
  <meta name="description" content="Carnet d'heures de vol, statistiques et échéances de qualifications, hors ligne avec synchronisation facultative.">
  <title>Horizon HDV · Premium PWA</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="icon-192.png" type="image/png">
  <meta name="color-scheme" content="dark">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://accounts.google.com/gsi/style; img-src 'self' data: blob:; connect-src 'self' https://www.googleapis.com https://accounts.google.com; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src https://accounts.google.com; upgrade-insecure-requests">
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <div class="brand"><span class="brand-icon">✧</span><div><b>HORIZON<span class="brand-fluo"> HDV</span></b><small>CARNET DE VOL · PWA</small></div></div>
      <div class="sidebar-label">NAVIGATION</div>
      <nav id="desktopNav" class="desktop-nav" aria-label="Navigation principale"></nav>
      <div class="sidebar-bottom"><div class="offline-led"></div><div><b>LOCAL + GOOGLE DRIVE</b><small>Utilisable hors connexion</small></div></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="top-logo"><span class="brand-icon">✧</span><span>HORIZON<span class="brand-fluo"> HDV</span><small> CARNET & QUALIFICATIONS</small></span></div>
        <div class="top-actions"><span class="date-chip" id="todayChip"></span><button class="avatar-btn" id="quickSettings" aria-label="Réglages">☷</button></div>
      </header>
      <div class="content" id="app" aria-live="polite"></div>
    </main>
    <nav class="bottom-nav" id="bottomNav" aria-label="Navigation mobile"></nav>
  </div>
  <div id="modalRoot"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="app.js"></script>
</body>
</html>
